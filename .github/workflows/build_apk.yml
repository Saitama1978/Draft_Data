name: Build and Release Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses & Install CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.2.9519653" || true

      - name: Create Flutter Android Project Structure
        run: flutter create . --platforms=android --org=com.renantefullo.shipcalc

      - name: Fix Android SDK 36 Global Override, V2 Embedding & App Name
        run: |
          # 1. Burahin ang duplicate .kts file
          rm -f android/app/build.gradle.kts

          # 2. Gumawa ng AndroidManifest.xml na may V2 Embedding at App Name
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Draft Survey Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. Gumawa ng Kotlin MainActivity
          mkdir -p android/app/src/main/kotlin/com/renantefullo/shipcalc
          cat << 'EOF' > android/app/src/main/kotlin/com/renantefullo/shipcalc/MainActivity.kt
          package com.renantefullo.shipcalc

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 4. Puwersahin ang LAHAT ng plugins/dependencies na gumamit ng compileSdk 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # 5. Baguhin din ang app-level build.gradle sa compileSdk 36
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle || true

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert and Generate App Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert icon.png -resize 48x48 PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Locate and Move APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk
          find build/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/app-release.apk \;

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Draft Survey Pro v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}