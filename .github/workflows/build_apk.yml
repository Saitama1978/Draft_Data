name: Build and Release Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses & Install CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;25.2.9519653" || true

      - name: Create Flutter Android Project Structure
        run: flutter create . --platforms=android --org=com.renantefullo.shipcalc

      - name: Fix Android Manifest, Styles, and SDK Settings
        run: |
          # 1. Burahin ang duplicate .kts file
          rm -f android/app/build.gradle.kts

          # 2. Gumawa ng styles.xml para hindi mag-crash sa Theme launch
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          # 3. Gumawa ng kumpletong AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Draft Survey Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 4. Gumawa ng Kotlin MainActivity
          mkdir -p android/app/src/main/kotlin/com/renantefullo/shipcalc
          cat << 'EOF' > android/app/src/main/kotlin/com/renantefullo/shipcalc/MainActivity.kt
          package com.renantefullo.shipcalc

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 5. Set SDK levels sa build.gradle
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          defaultConfig {
                              minSdkVersion 24
                          }
                      }
                  }
              }
          }
          EOF

          # 6. Set Debug Signing config sa Release build
          cat << 'EOF' >> android/app/build.gradle

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          # 7. Apply SDK updates sa app build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk .*/minSdk = 24/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk = 36/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/' android/app/build.gradle || true

          # 8. Gradle property overrides
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "flutter.minSdkVersion=24" >> android/gradle.properties

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Convert and Generate App Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert icon.png -resize 48x48 PNG32:android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon.png -resize 72x72 PNG32:android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon.png -resize 96x96 PNG32:android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon.png -resize 144x144 PNG32:android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon.png -resize 192x192 PNG32:android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK via Flutter CLI
        run: flutter build apk --release

      - name: Extract and Collect APK
        run: |
          mkdir -p final_apk
          cp build/app/outputs/flutter-apk/app-release.apk final_apk/app-release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Draft-Survey-Pro-APK
          path: final_apk/app-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Draft Survey Pro v1.0.${{ github.run_number }}
          files: final_apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}